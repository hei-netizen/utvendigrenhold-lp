:root{--teal:#007a8b;--teal-d:#005a67;--deep:#06343c;--ink:#0d2f35;--mute:#5b7480;--line:#dbe7ea;--bg2:#f3f8f9}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body.staticrypt-body{font-family:P,system-ui,sans-serif;font-weight:600;color:var(--ink);-webkit-font-smoothing:antialiased;
  background:radial-gradient(120% 80% at 85% 0%,rgba(120,220,230,.28),transparent 55%),linear-gradient(160deg,#0a5562 0%,var(--teal) 48%,#0b4752 100%);background-attachment:fixed}
/* takstein-mønster */
body.staticrypt-body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.10;
  background-image:radial-gradient(circle at 50% 0,transparent 15px,#fff 16px,#fff 17px,transparent 18px);background-size:36px 22px}
.hidden{display:none!important}
.staticrypt-spinner-container{min-height:100vh;display:flex;align-items:center;justify-content:center}
.staticrypt-spinner{width:44px;height:44px;border-radius:50%;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.staticrypt-page{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px}
.card{width:100%;max-width:430px;background:#fff;border-radius:28px;padding:38px 36px 32px;box-shadow:0 30px 80px rgba(2,30,36,.35),0 2px 0 rgba(255,255,255,.6) inset;animation:in .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.card{animation:none}.staticrypt-spinner{animation-duration:3s}}
.logo{display:block;height:46px;margin-bottom:26px}
.eyebrow{display:inline-block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal-d);background:#e3f2f4;border-radius:999px;padding:6px 12px;margin-bottom:12px}
.staticrypt-title{font-weight:800;font-size:30px;line-height:1.1;letter-spacing:-.02em;text-wrap:balance}
.sub{margin-top:8px;color:var(--mute);font-size:15px;line-height:1.5}
form{margin-top:26px;display:flex;flex-direction:column;gap:14px}
.field{position:relative}
.field .lock{position:absolute;left:16px;top:50%;width:20px;height:20px;transform:translateY(-50%);color:var(--teal)}
#staticrypt-password{width:100%;font:inherit;font-size:17px;color:var(--ink);background:var(--bg2);border:2px solid var(--line);border-radius:16px;padding:16px 52px 16px 48px;outline:none;transition:border-color .15s,box-shadow .15s,background .15s}
#staticrypt-password::placeholder{color:#93a7ad}
#staticrypt-password:focus{border-color:var(--teal);background:#fff;box-shadow:0 0 0 4px rgba(0,122,139,.14)}
.field.err #staticrypt-password{border-color:#d6402f;box-shadow:0 0 0 4px rgba(214,64,47,.12);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.staticrypt-toggle-password-visibility{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:24px;height:24px;opacity:.45;cursor:pointer;padding:2px}
.staticrypt-toggle-password-visibility:hover{opacity:.8}
.msg{min-height:0;color:#b8321f;font-size:14px;display:none}
.msg.on{display:block}
.staticrypt-remember{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink);cursor:pointer;user-select:none}
.staticrypt-remember input{appearance:none;-webkit-appearance:none;width:22px;height:22px;border:2px solid #b9cdd2;border-radius:7px;display:grid;place-content:center;cursor:pointer;transition:.15s;flex:none}
.staticrypt-remember input:checked{background:var(--teal);border-color:var(--teal)}
.staticrypt-remember input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.staticrypt-remember input:focus-visible{outline:3px solid rgba(0,122,139,.35);outline-offset:2px}
.staticrypt-decrypt-button{margin-top:4px;font:inherit;font-weight:800;font-size:17px;color:#fff;background:var(--teal);border:0;border-radius:16px;padding:17px 20px;cursor:pointer;box-shadow:0 10px 24px rgba(0,122,139,.35);transition:background .15s,transform .1s,box-shadow .15s}
.staticrypt-decrypt-button:hover{background:var(--teal-d)}
.staticrypt-decrypt-button:active{transform:translateY(1px)}
.staticrypt-decrypt-button:focus-visible{outline:3px solid #fff;outline-offset:-6px}
.staticrypt-decrypt-button[disabled]{opacity:.75;cursor:progress}
.books{margin-top:26px;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:680px}
.books span{color:#fff;font-size:13px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:7px 13px;backdrop-filter:blur(4px)}
.help{margin-top:16px;color:rgba(255,255,255,.82);font-size:13px;text-align:center;line-height:1.5}
.help a{color:#fff}
@media (max-width:420px){.card{padding:30px 22px 26px;border-radius:24px}.staticrypt-title{font-size:26px}}
</style>
</head>

    <body class="staticrypt-body">
        <div id="staticrypt_loading" class="staticrypt-spinner-container"><div class="staticrypt-spinner" role="status" aria-label="Laster"></div></div>
        <div id="staticrypt_content" class="staticrypt-content hidden">
